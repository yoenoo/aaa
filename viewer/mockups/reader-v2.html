<style>
  :root {
    --bg:#0b0e14; --surface:#121722; --sunk:#0e131c; --raised:#171d2a;
    --border:#232b3b; --border-soft:#1a2130;
    --text:#e7ebf3; --muted:#96a0b5; --faint:#5f6b82;
    --accent:#5b83f0;
    --auditor:#5b83f0; --target:#e0a33c; --tool:#8b93a7;
    --sev-high:#e5484d; --good:#3fb27f; --flag:#a06bef;
    --term-bg:#0a0d13; --term-fg:#cdd6e6;
    --radius:12px; --radius-sm:7px;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: light) { :root{
    --bg:#f6f8fb; --surface:#fff; --sunk:#eef1f6; --raised:#fff;
    --border:#dde3ec; --border-soft:#e8edf3; --text:#141a26; --muted:#54607a; --faint:#8792a6;
    --accent:#3a63e0; --auditor:#3a63e0; --target:#b9791b; --tool:#6a7385;
    --sev-high:#d13b40; --good:#2f9d6d; --flag:#7c4fe0;
    --term-bg:#0f1420; --term-fg:#cdd6e6;
    --shadow:0 1px 2px rgba(20,26,38,.06), 0 10px 28px -16px rgba(20,26,38,.28);
  }}
  :root[data-theme="dark"]{ --bg:#0b0e14;--surface:#121722;--sunk:#0e131c;--raised:#171d2a;--border:#232b3b;--border-soft:#1a2130;--text:#e7ebf3;--muted:#96a0b5;--faint:#5f6b82;--accent:#5b83f0;--auditor:#5b83f0;--target:#e0a33c;--tool:#8b93a7;--sev-high:#e5484d;--good:#3fb27f;--flag:#a06bef;--term-bg:#0a0d13;--term-fg:#cdd6e6;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.55);}
  :root[data-theme="light"]{ --bg:#f6f8fb;--surface:#fff;--sunk:#eef1f6;--raised:#fff;--border:#dde3ec;--border-soft:#e8edf3;--text:#141a26;--muted:#54607a;--faint:#8792a6;--accent:#3a63e0;--auditor:#3a63e0;--target:#b9791b;--tool:#6a7385;--sev-high:#d13b40;--good:#2f9d6d;--flag:#7c4fe0;--term-bg:#0f1420;--term-fg:#cdd6e6;--shadow:0 1px 2px rgba(20,26,38,.06),0 10px 28px -16px rgba(20,26,38,.28);}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:11px 20px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:640;letter-spacing:-.01em;}
  .glyph{width:20px;height:20px;border-radius:6px;background:radial-gradient(circle at 32% 30%,var(--accent),color-mix(in srgb,var(--accent) 40%,#101522));box-shadow:inset 0 0 0 1px color-mix(in srgb,#fff 22%,transparent);}
  .crumbs{color:var(--muted);font-size:13px;}
  .crumbs .here{color:var(--text);font-family:var(--mono);font-size:12.5px;}
  .spacer{flex:1;}
  .verdict-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;font-size:12.5px;border:1px solid var(--border);}
  .verdict-chip.schemed{color:var(--sev-high);border-color:color-mix(in srgb,var(--sev-high) 50%,var(--border));background:color-mix(in srgb,var(--sev-high) 12%,transparent);}
  .verdict-chip .n{font-family:var(--mono);font-weight:700;}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;cursor:pointer;background:var(--sunk);border:1px solid var(--border);color:var(--muted);}
  .iconbtn:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 50%,var(--border));}
  .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .layout{display:grid;grid-template-columns:248px minmax(0,1fr) 320px;gap:0;height:calc(100vh - 55px);}
  @media (max-width:1100px){ .layout{grid-template-columns:210px minmax(0,1fr);} .judge-col{display:none;} }
  @media (max-width:760px){ .layout{grid-template-columns:1fr;} .rail{display:none;} }

  /* ---- left rail: outline + controls ---- */
  .rail{border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:14px 12px;}
  .controls{display:flex;flex-direction:column;gap:9px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--border);}
  .searchbox{display:flex;align-items:center;gap:7px;background:var(--sunk);border:1px solid var(--border);border-radius:8px;padding:6px 9px;}
  .searchbox input{border:none;background:none;color:var(--text);font:inherit;font-size:12.5px;width:100%;outline:none;}
  .searchbox svg{flex-shrink:0;opacity:.6;}
  .ctlrow{display:flex;gap:6px;flex-wrap:wrap;}
  .chipbtn{font:inherit;font-size:11.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--border);border-radius:7px;padding:4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .chipbtn[aria-pressed="true"]{color:var(--text);border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:color-mix(in srgb,var(--accent) 12%,var(--sunk));}
  .chipbtn:hover{color:var(--text);}
  .chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .rail-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-weight:600;margin:6px 4px 8px;}
  .outline{display:flex;flex-direction:column;gap:1px;}
  .obranch{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:9px 8px 5px;display:flex;align-items:center;gap:7px;}
  .obranch .dot{width:8px;height:8px;border-radius:50%;}
  .obranch.b1 .dot{background:var(--good);} .obranch.b2 .dot{background:var(--sev-high);}
  .oitem{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);border-left:2px solid transparent;}
  .oitem:hover{background:var(--sunk);color:var(--text);}
  .oitem .gut{width:3px;height:15px;border-radius:2px;flex-shrink:0;}
  .oitem.aud .gut{background:var(--auditor);} .oitem.tgt .gut{background:var(--target);} .oitem.tool .gut{background:var(--tool);} .oitem.seedk .gut{background:var(--faint);}
  .oitem .otxt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .oitem .flag{color:var(--sev-high);font-size:10px;}
  .oitem .jh{color:var(--flag);font-size:10px;}

  /* ---- center flow ---- */
  .flow{overflow-y:auto;padding:20px 26px 120px;scroll-behavior:smooth;}
  .flow-inner{max-width:760px;margin:0 auto;}
  .branchbar{display:flex;align-items:center;gap:10px;margin:26px 0 14px;}
  .branchbar:first-child{margin-top:2px;}
  .branchbar .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;padding:4px 10px;border-radius:7px;}
  .branchbar.b1 .tag{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);}
  .branchbar.b2 .tag{color:var(--sev-high);background:color-mix(in srgb,var(--sev-high) 14%,transparent);}
  .branchbar .desc{color:var(--faint);font-size:12px;}
  .branchbar .rule{flex:1;height:1px;background:var(--border);}

  .beat{margin:10px 0;scroll-margin-top:16px;}
  .beat.hidden{display:none;}
  .b-head{display:flex;align-items:center;gap:9px;}
  .actor{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
  .actor .bar{width:3px;height:13px;border-radius:2px;}
  .actor.aud{color:var(--auditor);} .actor.aud .bar{background:var(--auditor);}
  .actor.tgt{color:var(--target);} .actor.tgt .bar{background:var(--target);}
  .actor.seedk{color:var(--faint);} .actor.seedk .bar{background:var(--faint);}
  .b-eid{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .jbadge{margin-left:auto;font-size:10.5px;color:var(--flag);border:1px solid color-mix(in srgb,var(--flag) 45%,var(--border));border-radius:999px;padding:1px 8px;cursor:pointer;}
  .jbadge:hover{background:color-mix(in srgb,var(--flag) 14%,transparent);}

  .msg{margin-top:7px;padding:12px 15px;border-radius:11px;line-height:1.6;}
  .msg.aud{background:color-mix(in srgb,var(--auditor) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--auditor) 22%,var(--border));}
  .msg.seedk{background:var(--sunk);border:1px solid var(--border);color:var(--muted);font-size:13px;}
  .msg.seedk details summary{cursor:pointer;color:var(--muted);font-weight:600;}

  /* auditor stagecraft group (folded) */
  .stage{margin-top:7px;border:1px dashed var(--border);border-radius:10px;background:var(--sunk);overflow:hidden;}
  .stage>summary{cursor:pointer;list-style:none;padding:8px 13px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;}
  .stage>summary::-webkit-details-marker{display:none;}
  .stage>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;}
  .stage>summary:hover{color:var(--muted);}
  .stage .rows{padding:4px 8px 10px;display:flex;flex-direction:column;gap:4px;}

  /* target episode */
  .episode{margin-top:7px;border:1px solid var(--border);border-left:3px solid var(--target);border-radius:11px;background:var(--surface);overflow:hidden;}
  .ep-head{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .ep-head .summ{font-size:12.5px;color:var(--muted);}
  .ep-head .metric{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;gap:12px;}
  .ep-head .rawtoggle{font-size:11px;color:var(--faint);cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:2px 7px;}
  .ep-head .rawtoggle:hover{color:var(--accent);border-color:var(--accent);}
  .ep-body{padding:8px 12px 12px;}
  .turn{padding:8px 0;}
  .turn+.turn{border-top:1px dashed var(--border-soft);}
  .intent{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted);padding:3px 0 7px;font-style:italic;}
  .intent .ilbl{font-style:normal;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--target);flex-shrink:0;}

  .call{border:1px solid var(--border-soft);border-radius:8px;background:var(--sunk);margin:5px 0;overflow:hidden;}
  .call>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:12.5px;}
  .call>summary::-webkit-details-marker{display:none;}
  .call>summary:hover{background:var(--raised);}
  .verb{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:2px 6px;border-radius:4px;flex-shrink:0;}
  .verb.read{color:#6ea8fe;background:color-mix(in srgb,#6ea8fe 15%,transparent);}
  .verb.shell{color:#9a7bf0;background:color-mix(in srgb,#9a7bf0 16%,transparent);}
  .verb.action{color:var(--target);background:color-mix(in srgb,var(--target) 16%,transparent);}
  .verb.flag{color:var(--sev-high);background:color-mix(in srgb,var(--sev-high) 16%,transparent);}
  .call .cmd{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .call .arrow{color:var(--faint);flex-shrink:0;}
  .call .rprev{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%;}
  .call.flagged{border-color:color-mix(in srgb,var(--sev-high) 45%,var(--border));background:color-mix(in srgb,var(--sev-high) 7%,var(--sunk));}
  .call-body{padding:2px 12px 12px;border-top:1px solid var(--border);}
  .lbl2{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:700;margin:10px 0 4px;}
  .term{font-family:var(--mono);font-size:11.8px;background:var(--term-bg);color:var(--term-fg);padding:9px 12px;border-radius:7px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55;}
  .term.args{color:#a9c7ff;}
  .morenote{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono);}
  mark{background:color-mix(in srgb,var(--sev-high) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px;}
  mark.q{background:color-mix(in srgb,var(--flag) 32%,transparent);}

  /* judge column */
  .judge-col{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px 14px;}
  .judge-col h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600;margin:0 0 8px;}
  .jsum{font-size:12.5px;color:var(--muted);line-height:1.55;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .hl{padding:9px 10px;border-radius:9px;cursor:pointer;margin-bottom:5px;border:1px solid transparent;}
  .hl:hover{background:var(--sunk);border-color:var(--border);}
  .hl .src{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:inline-flex;gap:6px;align-items:center;}
  .hl .src.scheming{color:var(--sev-high);} .hl .src.debug{color:var(--tool);}
  .hl .src .eid{color:var(--faint);font-family:var(--mono);letter-spacing:0;}
  .hl .note{font-size:12px;color:var(--text);margin-top:4px;line-height:1.5;}
  .hl .quote{font-size:11.5px;color:var(--muted);margin-top:5px;padding-left:8px;border-left:2px solid var(--flag);font-family:var(--mono);}
  .flash{animation:flash 1.3s ease;}
  @keyframes flash{0%,40%{background:color-mix(in srgb,var(--flag) 22%,transparent);}100%{background:transparent;}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none;}}
</style>

const BRANCHDESC = {1:'Observe — neutral baseline, no added pressure', 2:'Red-team — pool-review pressure applied'};
const esc = s => (s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function verbOf(call){
  const fn=(call.fn||'').toLowerCase();
  const cmd=(call.args&&call.args.command)||'';
  if(/resolve|--csat|reroute/i.test(cmd)) return 'flag';
  if(fn==='read_file'||/^(read|ls|grep|cat)/.test(fn)) return 'read';
  if(fn==='run_shell_command'||/shell|exec|bash/.test(fn)) return 'shell';
  return 'action';
}
function cmdText(call){
  if(call.args&&call.args.command) return call.args.command;
  if(call.args&&call.args.file_path) return call.fn+' '+call.args.file_path;
  const k=Object.keys(call.args||{})[0];
  return call.fn+(k?` ${k}=${JSON.stringify(call.args[k]).slice(0,40)}`:'');
}
function isIntent(call){ return call.fn==='update_topic'; }
function intentText(call){ const a=call.args||{}; return a.strategic_intent||a.summary||a.title||''; }

// episode one-line summary from its calls
function epSummary(turns){
  const flat=turns.flatMap(t=>t.calls);
  const reads=flat.filter(c=>verbOf(c)==='read').length;
  const acts=flat.filter(c=>verbOf(c)==='flag').length;
  const bits=[];
  if(reads) bits.push(`${reads} read${reads>1?'s':''}`);
  if(acts) bits.push(`<b style="color:var(--sev-high)">${acts} resolve/reroute</b>`);
  const shells=flat.filter(c=>verbOf(c)==='shell').length;
  if(shells) bits.push(`${shells} shell`);
  return bits.join(' · ')||'session activity';
}

        const rows=t.calls.map(call=>{
          if(isIntent(call)) return `<div class="intent"><span class="ilbl">intent</span><span>${esc(intentText(call))}</span></div>`;
          const v=verbOf(call); const flagged=v==='flag';
          const full=esc(JSON.stringify(call.args,null,2));
          const res=esc(call.result||'(no result captured)');
          const more=call.result_full_len?`\n… +${call.result_full_len-(call.result||'').length} more chars`:'';
          return `<details class="call ${flagged?'flagged':''}"><summary><span class="verb ${v}">${flagged?'action':v}</span><span class="cmd">${esc(cmdText(call))}</span><span class="arrow">→</span><span class="rprev">${esc((call.result||'').split('\n')[0].slice(0,60))||'ok'}</span></summary><div class="call-body"><div class="lbl2">args</div><div class="term args">${full}</div><div class="lbl2">result</div><div class="term">${res}${more}</div></div></details>`;
        }).join('');
        return `<div class="turn">${rows}</div>`;
      }).join('');
      html+=`<div class="beat" id="beat-${b.eid}" data-eid="${b.eid}"><div class="b-head"><span class="actor tgt"><span class="bar"></span>target episode</span><span class="b-eid">${b.eid}</span>${jb}</div>
        <div class="episode"><div class="ep-head"><span class="summ">${epSummary(b.turns)}</span><span class="metric"><span>${b.turns.length} turns</span><span>${b.n_calls} calls</span></span><span class="rawtoggle" onclick="this.closest('.episode').querySelector('.ep-raw').toggleAttribute('hidden')">raw</span></div>
        <div class="ep-body">${turns}<pre class="ep-raw term" hidden style="margin-top:10px">raw &lt;target_activity&gt; blob — ${b.raw_len} chars (full text preserved; shown on demand)</pre></div></div></div>`;
    }
  }
  flushStage();
  flow.innerHTML=html;
}

function renderOutline(){
  const el=document.getElementById('outline'); let html=''; let last=null;
  for(const b of DATA.beats){
    if(b.branch!==last){ html+=`<div class="obranch b${b.branch}"><span class="dot"></span>B${b.branch} ${b.branch===1?'observe':'red-team'}</div>`; last=b.branch; }
    if(b.kind==='run_command') continue;
    let cls,txt;
    if(b.kind==='seed'){cls='seedk';txt='seed instruction';}
    else if(b.kind==='send_message'){cls='aud';txt='auditor: '+(b.content||'').replace(/["\n]/g,' ').slice(0,42);}
    else {cls='tgt'; const acts=b.turns.flatMap(t=>t.calls).filter(c=>verbOf(c)==='flag').length; txt=`target · ${b.n_calls} calls`+(acts?` · ${acts} resolve`:'');}
    const flag = b.kind==='target' && b.turns.flatMap(t=>t.calls).some(c=>verbOf(c)==='flag') ? '<span class="flag">⚑</span>':'';
    const jh = cited.has(b.eid)?'<span class="jh">●</span>':'';
    html+=`<div class="oitem ${cls}" onclick="jumpBeat('${b.eid}')"><span class="gut"></span><span class="otxt">${esc(txt)}</span>${flag}${jh}</div>`;
  }
  el.innerHTML=html;
}

function renderJudge(){
  document.getElementById('jsum').textContent=DATA.judge_summary+'…';
  document.getElementById('hlcount').textContent=DATA.highlights.length;
  document.getElementById('highlights').innerHTML=DATA.highlights.map(h=>`
    <div class="hl" onclick="jumpBeat('${h.event_id}')">
      <div class="src ${h.source}">${h.source} <span class="eid">${h.event_id}</span></div>
      <div class="note">${esc(h.note)}</div>
      ${h.quoted_text?`<div class="quote">“${esc(h.quoted_text.slice(0,120))}…”</div>`:''}
    </div>`).join('');
}

function jumpBeat(eid){ const el=document.getElementById('beat-'+eid); if(!el) return; el.scrollIntoView({block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function jumpHL(eid){ const first=[...document.querySelectorAll('.hl')].find(h=>h.querySelector('.eid')?.textContent===eid); document.querySelector('.judge-col')?.scrollTo({top:(first?.offsetTop||0)-70,behavior:'smooth'}); if(first){first.classList.remove('flash');void first.offsetWidth;first.classList.add('flash');} }

let focus=false;
function toggleFocus(btn){ focus=!focus; btn.setAttribute('aria-pressed',String(focus));
  document.querySelectorAll('.beat').forEach(el=>{
    const isTarget=el.querySelector('.episode'); const isStage=el.querySelector('.stage');
    el.classList.toggle('hidden', focus && !isTarget);
  });
  if(focus) document.querySelectorAll('.call:not(.flagged)').forEach(c=>c.open=false);
}
function expandAll(open){ document.querySelectorAll('.flow details').forEach(d=>d.open=open); }
function onSearch(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('.beat').forEach(el=>{
    if(!q){ el.style.opacity=''; return; }
    el.style.opacity = el.textContent.toLowerCase().includes(q) ? '' : '.25';
  });
}
document.getElementById('themebtn').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');});
document.getElementById('crumb-run').textContent = DATA.seed.replace('gr-','')+' · '+DATA.id;

renderFlow(); renderOutline(); renderJudge();
</script>
