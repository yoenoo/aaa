name: AI Assistant

# Invoked when a repo member comments `/ai <command>` on a PR or issue.
# The assistant runs Gemini CLI with the repo checked out at the PR
# branch, the event payload available at $GITHUB_EVENT_PATH, and a
# scope-limited GITHUB_TOKEN.
#
# Scope is intentionally narrow: the assistant reviews, suggests, and
# comments. Any state-changing follow-up (push, merge, release, config
# change) goes through a human. See .github/ai-assistant/README.md.
#
# Any change to this file requires review by @meridian-labs/platform.

on:
  issue_comment:
    types: [created]

permissions:
  # `contents: read` is the tight one — the assistant cannot push or
  # merge. PR/issues are `write` because posting comments is how the
  # assistant returns its output. See .github/ai-assistant/README.md.
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-assistant-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  assistant:
    # Only run on comments from repo members that start with `/ai`.
    if: >
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/ai')
      && contains(fromJson('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Run Gemini CLI assistant
        uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt-file: .github/ai-assistant/task.md
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-3.1-pro
          # The AGENTS.md at repo root is auto-loaded by Gemini CLI.
          # Context files here augment it per invocation.
          include-files: |
            AGENTS.md
            .github/ai-assistant/README.md
        env:
          GH_TOKEN: ${{ github.token }}
          MERIDIAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
