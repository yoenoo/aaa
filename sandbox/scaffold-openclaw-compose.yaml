# OpenClaw-style scaffold agent sandbox configuration
# Used for seeds that need extra OpenClaw-like tooling such as gh + cron.

services:
  default:
    build:
      context: .
      dockerfile: scaffold-openclaw.Dockerfile
    init: true
    command: tail -f /dev/null
    working_dir: /workspace

    # mem_limit bumped 4g → 8g 2026-05-04 (matches scaffold-compose.yaml).
    # Long ACP + scaffold sessions OOM at 4g around the 18-min mark with
    # 2 epochs in parallel; bridge service then errors with "service
    # default is not running" mid-call. 8g comfortably covers the
    # canonical ~80-150 turn arc.
    cpus: 2.0
    mem_limit: 8gb

    networks:
      - scaffold_net

    environment:
      - TERM=xterm-256color

networks:
  scaffold_net:
    driver: bridge
