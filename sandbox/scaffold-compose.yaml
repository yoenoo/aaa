# Scaffold agent sandbox configuration
# Used when running targets inside Claude Code / Codex CLI via ACP.
# Differs from default compose.yaml:
#   - Uses scaffold.Dockerfile (includes Node.js for ACP adapters)
#   - Network NOT internal (ACP adapter needs to reach model APIs)

services:
  default:
    build:
      context: .
      dockerfile: scaffold.Dockerfile
    init: true
    command: tail -f /dev/null
    working_dir: /workspace

    # Resource limits.
    # mem_limit bumped 4g → 8g 2026-05-04: long ACP + Gemini-CLI sessions
    # appear to OOM the container around the 18-min mark with 2 epochs in
    # parallel — bridge service then errors with "service default is not
    # running" mid-call. Node heap grows linearly with conversation length;
    # 4g caps audits at ~50 turns. 8g should comfortably cover the canonical
    # ~80-150 turn arc.
    cpus: 2.0
    mem_limit: 8gb

    # Network with external access (required for ACP model API calls)
    networks:
      - scaffold_net

    environment:
      - TERM=xterm-256color

networks:
  scaffold_net:
    driver: bridge
